name: ReviewBuddy AI Code Review
description: AI code review on every pull request, posted as inline comments. Can fail the check or request changes on chosen severities.
# Settings also come from the reviewed repo's .reviewbuddy.json and .reviewbuddy.md, read from the PR's base branch.
# A non-empty input below overrides the same setting in .reviewbuddy.json.
author: fernandesnaycaden-debug
branding:
  icon: eye
  color: blue

inputs:
  github-token:
    description: Token used to read the pull request, post the review and dismiss reviewbuddy's own outdated change requests. Needs pull-requests write permission.
    default: ${{ github.token }}
  provider:
    description: Model provider, one of groq, openrouter, gemini, anthropic (ollama only with OLLAMA_URL set). Always overrides provider in .reviewbuddy.json.
    required: true
  model:
    description: Model name for the chosen provider. Empty uses model from .reviewbuddy.json if it names the same provider, else reviewbuddy's default.
    default: ''
  api-key:
    description: API key for the chosen provider. Pass it from a secret, e.g. secrets.GROQ_API_KEY.
    default: ''
  fail-on:
    description: Comma-separated severities that fail the check (bug, security, performance, suggestion). Empty uses failOn from .reviewbuddy.json, else never fails.
    default: ''
  request-changes-on:
    description: Comma-separated severities that make the review request changes instead of only commenting, like --request-changes-on. It never approves. Empty uses requestChangesOn from .reviewbuddy.json, else only comments.
    default: ''
  min-severity:
    description: Least serious severity to report (security > bug > performance > suggestion), like --min-severity. Empty uses .reviewbuddy.json, else reports everything.
    default: ''
  ignore:
    description: Extra comma-separated file patterns to skip, like --ignore. Added to the defaults and to ignore in .reviewbuddy.json.
    default: ''
  full:
    description: Review the whole PR instead of only the commits since the last reviewbuddy review.
    default: 'false'
  timeout:
    description: Seconds a single model request may take (0 = no limit). Empty uses .reviewbuddy.json, else the default.
    default: ''
  concurrency:
    description: How many files to review at once (1-16), like --concurrency. Empty uses .reviewbuddy.json, else the provider's default (2 for groq and openrouter, 4 for gemini and anthropic).
    default: ''
  max-files:
    description: Review at most this many files, like --max-files; source files and the biggest changes go first, and the rest are listed in the review. Empty uses .reviewbuddy.json, else no limit.
    default: ''
  max-chunks-per-file:
    description: Review at most this many pieces of one file (0 = no limit), like --max-chunks-per-file. Empty uses .reviewbuddy.json, else 10.
    default: ''
  config:
    description: Read .reviewbuddy.json and .reviewbuddy.md from the PR's base branch. 'false' ignores both, like --no-config.
    default: 'true'
  sarif-file:
    description: Also write the findings as SARIF 2.1.0 to this path, for github/codeql-action/upload-sarif. Implies full, so every upload has every finding in the PR. Empty writes none.
    default: ''

outputs:
  sarif-file:
    description: The SARIF file's path, set when sarif-file was given and the file was written (also when fail-on fails the step). Empty otherwise.
    value: ${{ steps.review.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Review pull request
      id: review
      shell: bash
      # Inputs reach the script only as environment variables, never interpolated into it,
      # so a crafted value can't inject shell commands.
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_REQUEST_CHANGES_ON: ${{ inputs.request-changes-on }}
        INPUT_MIN_SEVERITY: ${{ inputs.min-severity }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_FULL: ${{ inputs.full }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_MAX_CHUNKS_PER_FILE: ${{ inputs.max-chunks-per-file }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || [ -z "$PR_URL" ]; then
          echo "::error::reviewbuddy runs on pull_request events (this run is \"$GITHUB_EVENT_NAME\"). Trigger the workflow with on: pull_request."
          exit 1
        fi

        export GITHUB_TOKEN="$INPUT_GITHUB_TOKEN"
        export REVIEWBUDDY_PROVIDER="$INPUT_PROVIDER"
        export REVIEWBUDDY_FAIL_ON="$INPUT_FAIL_ON"
        export REVIEWBUDDY_REQUEST_CHANGES_ON="$INPUT_REQUEST_CHANGES_ON"
        export REVIEWBUDDY_MIN_SEVERITY="$INPUT_MIN_SEVERITY"
        export REVIEWBUDDY_IGNORE="$INPUT_IGNORE"
        export REVIEWBUDDY_TIMEOUT="$INPUT_TIMEOUT"
        export REVIEWBUDDY_CONCURRENCY="$INPUT_CONCURRENCY"
        export REVIEWBUDDY_MAX_FILES="$INPUT_MAX_FILES"
        export REVIEWBUDDY_MAX_CHUNKS_PER_FILE="$INPUT_MAX_CHUNKS_PER_FILE"

        # Each provider reads its own key and model variables.
        case "$(echo "$INPUT_PROVIDER" | tr '[:upper:]' '[:lower:]')" in
          groq)       key_var=GROQ_API_KEY;       model_var=GROQ_MODEL ;;
          openrouter) key_var=OPENROUTER_API_KEY; model_var=OPENROUTER_MODEL ;;
          gemini)     key_var=GEMINI_API_KEY;     model_var=GEMINI_MODEL ;;
          anthropic)  key_var=ANTHROPIC_API_KEY;  model_var=ANTHROPIC_MODEL ;;
          ollama|'')  key_var='';                 model_var=OLLAMA_MODEL ;;
          *)          key_var='';                 model_var='' ;;  # reviewbuddy reports the unknown provider
        esac
        if [ -n "$key_var" ] && [ -n "$INPUT_API_KEY" ]; then export "$key_var=$INPUT_API_KEY"; fi
        if [ -n "$model_var" ] && [ -n "$INPUT_MODEL" ]; then export "$model_var=$INPUT_MODEL"; fi

        args=()
        if [ "$INPUT_FULL" = "true" ]; then args+=(--full); fi
        if [ "$INPUT_CONFIG" = "false" ]; then args+=(--no-config); fi
        # Code scanning closes alerts missing from the latest upload, so a SARIF file must cover the
        # whole PR, not only the commits since the last review.
        if [ -n "$INPUT_SARIF_FILE" ]; then args+=(--full --format sarif --output "$INPUT_SARIF_FILE"); fi

        # fail-on exits with 1; the output is still set so a later step can upload the findings.
        status=0
        node "$GITHUB_ACTION_PATH/bin/reviewbuddy.js" "$PR_URL" "${args[@]}" || status=$?
        if [ -n "$INPUT_SARIF_FILE" ] && [ -f "$INPUT_SARIF_FILE" ]; then
          echo "sarif-file=$INPUT_SARIF_FILE" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"
